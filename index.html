<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宝石商人 · 著作权法邻接权知识学习</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div id="app">

    <!-- ======================= 前传 ======================= -->
    <section id="screen-prologue" class="screen hidden">
      <div class="prologue-scene">
        <div id="prologue-bg" class="prologue-bg"></div>
      </div>
      <div class="prologue-buttons">
        <button id="prologue-skip" class="btn ghost">跳过前传</button>
        <button id="prologue-next" class="btn primary">下一步 ▶</button>
      </div>
      <div id="prologue-text" class="prologue-text"></div>
    </section>

    <!-- ======================= 主页 ======================= -->
    <section id="screen-home" class="screen hidden">
      <div class="home-inner">
        <div class="game-title">
          <h1>💎 宝石商人</h1>
          <p class="subtitle">著作权法 · 邻接权 知识学习</p>
        </div>

        <div class="home-status">
          <div class="status-chip">🪙 金币 <b id="home-coins">0</b></div>
          <div class="status-chip">🏠 生活状况 <b id="home-tier">一穷二白</b></div>
        </div>

        <nav class="menu">
          <button id="btn-start" class="menu-btn primary">开始游戏</button>
          <button id="btn-levels" class="menu-btn">选择关卡</button>
          <button id="btn-life" class="menu-btn">我的生活状况</button>
          <button id="btn-help" class="menu-btn">玩法说明</button>
          <button id="btn-prologue" class="menu-btn">重看前传</button>
        </nav>
      </div>
    </section>

    <!-- ======================= 关卡选择 ======================= -->
    <section id="screen-levels" class="screen hidden">
      <h2 class="page-title">选择关卡</h2>
      <div id="chapter-list" class="chapter-list"></div>
      <button id="btn-back-home" class="btn ghost">← 返回主页</button>
    </section>

    <!-- ======================= 小关卡选择 ======================= -->
    <section id="screen-sublevels" class="screen hidden">
      <h2 id="sublevel-chapter-name" class="page-title">邻接权概述</h2>
      <p class="page-hint">选择一个小关卡，用放大镜找出正确的知识点宝石</p>
      <div id="sublevel-list" class="sublevel-list"></div>
      <button id="btn-back-levels" class="btn ghost">← 返回关卡</button>
    </section>

    <!-- ======================= 游戏场景 ======================= -->
    <section id="screen-game" class="screen hidden">
      <div id="game-hud" class="game-hud">
        <div class="hud-item">🪙 <span id="hud-coins">0</span></div>
        <div id="game-title" class="hud-title"></div>
        <div id="hud-lives" class="hud-item lives"></div>
      </div>

      <div id="stall-scene" class="stall-scene">
        <!-- 摊主 -->
        <div id="stall-owner" class="stall-owner" title="摊主">
          <div class="owner-head"><div class="owner-eye l"></div><div class="owner-eye r"></div><div class="owner-mouth"></div></div>
          <div class="owner-body"></div>
        </div>

        <!-- 摊子 -->
        <div id="stall" class="stall">
          <div class="stall-awning"></div>
          <div class="stall-awning-stripes"></div>
          <div id="gems-container" class="gems-container"></div>
          <div class="stall-table"></div>
        </div>

        <div class="scene-hint">🔍 用放大镜查看宝石，点击查看知识内容，选出正确的知识点！</div>
      </div>

      <!-- 放大镜光标（铜框"辨珍"放大镜） -->
      <div id="magnifier" class="magnifier hidden">
        <div class="mag-lens"></div>
        <div class="mag-handle"></div>
      </div>

      <!-- 宝石知识弹窗 -->
      <div id="gem-popup" class="gem-popup hidden">
        <div class="popup-header">
          <span class="popup-dot"></span>
          <div id="gem-popup-title" class="popup-title"></div>
        </div>
        <div id="gem-popup-content" class="popup-content"></div>
        <div class="popup-buttons">
          <button id="btn-close-gem" class="btn ghost">再想想</button>
          <button id="btn-confirm-gem" class="btn primary">确认选择这颗宝石</button>
        </div>
      </div>
    </section>

    <!-- ======================= 生活状况 ======================= -->
    <section id="screen-life" class="screen hidden">
      <h2 class="page-title">我的生活状况</h2>
      <div class="life-stage">
        <div id="life-house" class="life-house"></div>
        <div id="life-character" class="life-character">
          <div class="life-head"></div>
          <div class="life-body"></div>
        </div>
      </div>
      <div id="life-tier-name" class="life-tier-name">一穷二白</div>
      <div id="life-desc" class="life-desc"></div>
      <div class="life-progress-wrap">
        <div id="life-progress" class="life-progress"></div>
        <div id="life-progress-text" class="life-progress-text"></div>
      </div>
      <div class="life-tiers-list" id="life-tiers-list"></div>
      <button id="btn-back-home-2" class="btn ghost">← 返回主页</button>
    </section>

    <!-- ======================= 通用弹窗 ======================= -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-message" class="modal-message"></div>
        <div id="modal-buttons" class="modal-buttons"></div>
      </div>
    </div>

    <!-- ======================= 轻提示 ======================= -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="data.js?v=4"></script>
  <script src="game.js?v=4"></script>
</body>
</html>
